name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: emr_test
      POSTGRES_PASSWORD: unused
      POSTGRES_DB: emr_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emr_test
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: emr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emr_test -d emr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migration chain
        run: |
          alembic upgrade head
          alembic current
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend medication grouping
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
