name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: emr_test
      POSTGRES_PASSWORD: unused
      POSTGRES_DB: emr_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emr_test
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: emr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emr_test -d emr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migration chain
        run: |
          alembic upgrade head
          alembic current
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  public-demo-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify public demo files
        run: |
          test -s demo/index.html
          test -s demo/styles.css
          test -s demo/app.js
          grep -q 'aria-label="Legal notice"' demo/index.html
          grep -q "Not approved for clinical use" demo/index.html
          grep -q "Do not enter real patient information" demo/index.html
      - name: Check public demo palette contrast
        run: python scripts/check_demo_contrast.py
      - name: Serve and request public demo
        run: |
          python3 -m http.server 4173 --directory demo > /tmp/emr-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/emr-demo.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/styles.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js > /dev/null
          grep -q "Primary Care EMR" /tmp/emr-demo.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependencies
        run: |
          python3 -m venv /tmp/emr-demo-venv
          /tmp/emr-demo-venv/bin/pip install playwright==1.51.0
          /tmp/emr-demo-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise public demo in Chromium
        run: |
          python3 -m http.server 4173 --directory demo > /tmp/emr-demo-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          EMR_DEMO_URL=http://127.0.0.1:4173/ /tmp/emr-demo-venv/bin/python scripts/check_demo_browser.py

  api-browser-smoke:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: emr_smoke
      POSTGRES_PASSWORD: disposable-ci-only
      POSTGRES_DB: emr_browser_smoke
      EMR_RUN_SYNTHETIC_SMOKE: "1"
      VITE_API_BASE_URL: http://127.0.0.1:8000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emr_smoke
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: emr_browser_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emr_smoke -d emr_browser_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and browser dependencies
        run: |
          python -m pip install -r backend/requirements.txt playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Migrate and seed disposable PostgreSQL
        run: |
          alembic upgrade head
          python -m backend.seed
      - name: Build real React application
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Exercise real staff and patient workflows
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/emr-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/emr-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8000/ http://127.0.0.1:5173/; do
            for attempt in {1..30}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent --show-error "$url" > /dev/null
          done
          python -m scripts.check_app_browser

  interactive-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_EMR_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare self-hosted Python runtime
        run: python scripts/build_browser_runtime.py
      - name: Build interactive application
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Test browser-only clinical workflows and reset
        run: |
          mkdir -p /tmp/emr-pages
          ln -s "$PWD/frontend/dist" /tmp/emr-pages/primary-care-emr
          python -m http.server 4174 --bind 127.0.0.1 --directory /tmp/emr-pages > /tmp/emr-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/primary-care-emr/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check_browser_emr.py
          python scripts/check_browser_clinical_api.py
