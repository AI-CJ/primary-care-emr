name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: emr_test
      POSTGRES_PASSWORD: unused
      POSTGRES_DB: emr_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emr_test
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: emr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emr_test -d emr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migration chain
        run: |
          alembic upgrade head
          alembic current
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  public-demo-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify public demo files
        run: |
          test -s demo/index.html
          test -s demo/styles.css
          test -s demo/app.js
          grep -q "Synthetic portfolio demo" demo/index.html
          grep -q "not approved for clinical use" demo/index.html
      - name: Serve and request public demo
        run: |
          python3 -m http.server 4173 --directory demo > /tmp/emr-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/emr-demo.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/styles.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js > /dev/null
          grep -q "Primary Care EMR" /tmp/emr-demo.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependencies
        run: |
          python3 -m venv /tmp/emr-demo-venv
          /tmp/emr-demo-venv/bin/pip install playwright==1.51.0
          /tmp/emr-demo-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise public demo in Chromium
        run: |
          python3 -m http.server 4173 --directory demo > /tmp/emr-demo-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          EMR_DEMO_URL=http://127.0.0.1:4173/ /tmp/emr-demo-venv/bin/python scripts/check_demo_browser.py
