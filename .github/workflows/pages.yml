name: Deploy public demo

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser runtime
        run: python scripts/build_browser_runtime.py
      - name: Build public application
        working-directory: frontend
        env:
          VITE_EMR_BROWSER: "1"
        run: |
          npm ci
          npm run build
      - name: Upload public application
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count')
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 4
          done
          echo 'Expected exactly one uploaded Pages artifact.' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish V1 release after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_TARGET: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
            exit 0
          fi

          cat > /tmp/emr-v1-release.md <<EOF
          Primary Care EMR V1.0.0 is a synthetic-data portfolio release demonstrating outpatient staff workflows and a patient-facing portal.

          **Public demo:** ${PAGE_URL}

          The original V1 release uses fictional records. See the repository documentation for the current public application's execution model and the PostgreSQL-backed local application.

          Verification includes the PostgreSQL migration chain, backend tests, frontend lint and unit tests, production build, Chromium checks for the public demo, and a disposable-database full-stack browser workflow covering staff permissions, archive/reactivation, patient access, preference persistence, keyboard operation, and mobile layout.

          This release is not HIPAA compliant, is not approved for clinical use, and must never receive real patient information. See `docs/V1_RELEASE.md` for the complete release boundary and known limitations.
          EOF

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Primary Care EMR V1.0.0" \
            --notes-file /tmp/emr-v1-release.md
